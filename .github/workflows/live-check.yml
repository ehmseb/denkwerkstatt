name: Echttest mit echtem Modell

# Läuft nur von Hand (Actions, «Run workflow»), nie bei einem Push, weil jeder Lauf Geld kostet.
# Schlüssel kommen aus den Repository-Secrets (Settings, Secrets and variables, Actions).
# Achtung: Das Repo ist öffentlich, Protokoll und Ergebnisdateien dieses Laufs sind für alle sichtbar.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Anbieter (anthropic oder mistral)
        default: anthropic
        type: choice
        options: [anthropic, mistral]
      model:
        description: Hauptmodell (leer = Vorgabe des Skripts)
        default: ''
      fast_model:
        description: Schnellmodell (leer = Vorgabe des Skripts)
        default: ''
      levels:
        description: Stufen, durch Komma getrennt
        default: leicht,mittel,stark

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright einrichten
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Echttest
        env:
          LIVE_PROVIDER: ${{ inputs.provider }}
          LIVE_MODEL: ${{ inputs.model }}
          LIVE_FAST_MODEL: ${{ inputs.fast_model }}
          LIVE_LEVELS: ${{ inputs.levels }}
          LIVE_OUT: live-out
          LIVE_PRINT_RAW: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python tests/live_check.py
      - name: Ergebnisse sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-check-${{ inputs.provider }}-${{ github.run_number }}
          path: live-out/
          retention-days: 14
          if-no-files-found: ignore
